# Non-secret config for L4 (test-plan.md section 6). Real secrets never live here.
# server.ts serves both the API and the built/dev SPA on the same port (confirmed via API-10 -
# the SPA fallback route is served from the same Express process) - default port 3000, override
# with -Dbase.url=... to point at an isolated PORT instance instead.
base.url=http://localhost:3000
emulator.auth.host=127.0.0.1
emulator.auth.port=9099
emulator.firestore.host=127.0.0.1
emulator.firestore.port=8080
emulator.project.id=big-elysium-496003-j7
browser.headless=true
# The web app, when pointed at the emulator, writes under its own Firebase project id (observed via REST
# 2026-10-04), NOT the emulator's demo-qicau-test. Seeding/inspecting app data must use this id.
emulator.app.project.id=big-elysium-496003-j7
